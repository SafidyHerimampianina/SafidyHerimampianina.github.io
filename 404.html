<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <base href="/" />
    <title>Page introuvable — Safidy Herimampianina</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 20px;
        color: #f5f5f7;
        font-family: 'Roboto Mono', monospace;
        background:
          radial-gradient(ellipse 80% 60% at 55% 20%, #34414f 0%, transparent 70%),
          linear-gradient(180deg, #232a33, #1c1c21);
      }
      h1 {
        margin: 0;
        font-family: Poppins, sans-serif;
        font-weight: 800;
        font-size: clamp(5rem, 22vw, 11rem);
        line-height: 1;
      }
      p {
        margin: 16px 0 32px;
        color: #a1a1aa;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        background: #f4a261;
        color: #1a140f;
        text-decoration: none;
        border-radius: 4px;
      }
      a:focus-visible {
        outline: 2px solid #ffe2b8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Cette page n’existe pas · This page doesn’t exist</p>
      <!-- Chemin relatif : fonctionne sur un domaine personnalisé comme sur username.github.io/depot/ -->
      <a href="./">← Retour à l’accueil</a>
    </main>
  </body>
</html>
